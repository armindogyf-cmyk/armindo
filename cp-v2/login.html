<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><title>CP · Acesso privado</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7fb;color:#152033;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}.w{width:min(440px,100%);padding:22px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.mark{display:grid;grid-template-columns:repeat(2,16px);gap:4px}.mark i{width:16px;height:16px;border-radius:5px;background:#3384df}.mark i:nth-child(2),.mark i:nth-child(3){opacity:.65}.brand b{display:block;font-size:22px}.brand span,.muted{color:#758196}.card{background:#fff;border:1px solid #e1e7ef;border-radius:24px;padding:24px;box-shadow:0 16px 50px #1b36520d}h1{font-size:25px;margin:0 0 8px}label{display:block;font-weight:750;margin:18px 0 7px}input{width:100%;padding:14px 15px;border:1px solid #cdd7e4;border-radius:13px;font-size:17px;background:#fbfcfe}button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:14px;background:#2477d4;color:#fff;font-weight:850;font-size:16px}button:disabled{opacity:.5}.msg{margin-top:14px;padding:11px 12px;border-radius:11px;background:#f2f6fb;color:#526174;font-size:13px}.err{background:#fff0f1;color:#a72c38}.ok{background:#ecfaf3;color:#18784a}.foot{text-align:center;color:#8a95a6;font-size:12px;margin-top:18px}</style></head><body><main class="w"><div class="brand"><div class="mark"><i></i><i></i><i></i><i></i></div><div><b>CP</b><span>Automotive Knowledge Platform</span></div></div><section class="card"><div id="phoneStep"><h1>Acesso privado</h1><p class="muted">Introduza o número autorizado. Enviaremos um código temporário por SMS.</p><label for="phone">Telemóvel</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="+351 9xx xxx xxx"><button id="send">Enviar código</button></div><div id="codeStep" hidden><h1>Confirmar código</h1><p class="muted">Introduza o código de 6 dígitos enviado para <b id="masked"></b>.</p><label for="code">Código</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="verify">Entrar na CP</button><button id="back" style="background:#eef3f8;color:#40516a">Usar outro número</button></div><div id="msg" class="msg">Apenas números previamente autorizados podem aceder.</div></section><div class="foot">CP V2.1 · OTP · sessão privada · PT-PT</div></main><script>const $=id=>document.getElementById(id),msg=(t,c='')=>{const m=$('msg');m.className='msg '+c;m.textContent=t};let phone='';async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Não foi possível concluir o pedido.');return j}$('send').onclick=async()=>{phone=$('phone').value.trim();if(!phone)return msg('Indique o número de telemóvel.','err');$('send').disabled=true;try{const j=await post('/api/auth/request',{phone});$('masked').textContent=j.masked||phone;$('phoneStep').hidden=true;$('codeStep').hidden=false;msg('Código enviado. É válido por poucos minutos.','ok');$('code').focus()}catch(e){msg(e.message,'err')}finally{$('send').disabled=false}};$('verify').onclick=async()=>{const code=$('code').value.trim();if(!/^\d{6}$/.test(code))return msg('Introduza os 6 dígitos do código.','err');$('verify').disabled=true;try{await post('/api/auth/verify',{phone,code});location.replace('/')}catch(e){msg(e.message,'err')}finally{$('verify').disabled=false}};$('back').onclick=()=>{$('codeStep').hidden=true;$('phoneStep').hidden=false;msg('Apenas números previamente autorizados podem aceder.');};fetch('/api/auth/session',{credentials:'include'}).then(r=>{if(r.ok)location.replace('/')});</script></body></html>
