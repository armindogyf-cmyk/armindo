<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07131f"><title>CP Consulta</title><style>:root{--bg:#07131f;--p:#0d1f2d;--line:#1b3d52;--txt:#eef7fb;--muted:#9db6c6;--c:#19b9d2;--g:#4bd08b;--a:#ffb020;--r:#ff6470}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#06111a,#091a26 45%,#07131f);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.w{max-width:1250px;margin:auto;padding:0 14px 60px}.head{position:sticky;top:0;z-index:10;background:#07131ff2;backdrop-filter:blur(14px);border-bottom:1px solid #17374a;margin:0 -14px 14px;padding:10px 14px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;background:var(--c);color:#03131b;display:grid;place-items:center;font-weight:950;font-size:22px}.k{color:var(--c);font-weight:850;font-size:10px;letter-spacing:.11em;text-transform:uppercase}h1{font-size:20px;margin:3px 0}.m{color:var(--muted)}.nav{display:flex;gap:7px;overflow:auto;margin-top:9px}.btn{display:inline-block;border:1px solid #28536b;background:#0b2332;color:#dff5fb;text-decoration:none;border-radius:10px;padding:8px 10px;font-weight:800;white-space:nowrap}.btn.primary{background:var(--c);color:#03131b;border-color:var(--c)}.searchbox{background:linear-gradient(#0e2231,#0b1d2a);border:1px solid var(--line);border-radius:18px;padding:16px}.searchrow{display:flex;gap:8px;flex-wrap:wrap}.q{flex:1;min-width:240px;background:#071823;color:#fff;border:1px solid #285269;border-radius:12px;padding:13px 14px;font-size:16px}.sel{background:#071823;color:#fff;border:1px solid #285269;border-radius:12px;padding:12px;min-width:155px}.chips{display:flex;gap:6px;overflow:auto;margin-top:10px;padding-bottom:2px}.chip{border:1px solid #28536b;background:#0c2030;color:#d2e8f1;border-radius:999px;padding:7px 9px;font-weight:700;white-space:nowrap}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:850}.part{background:#10344a;color:#8bdff1}.fault{background:#452027;color:#ffb5bd}.ref{background:#3e2b0c;color:#ffd37f}.manual{background:#113a2c;color:#9af3c1}.source{background:#30234c;color:#cdb8ff}.task{background:#3b2636;color:#ffc0e2}.vehicle{background:#183c42;color:#a6eef2}.result{background:#0d1f2d;border:1px solid var(--line);border-radius:15px;padding:13px;margin:8px 0}.result h3{font-size:15px;margin:3px 0 5px}.result p{margin:4px 0}.small{font-size:12px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.mini{border:1px solid #28536b;background:#071823;color:#dff5fb;border-radius:9px;padding:7px 8px;font-weight:750}.fav{background:#2d260d;color:#ffd56e}.section{margin-top:14px}.empty{padding:28px;text-align:center;color:var(--muted);background:#0b1d2a;border:1px dashed #28536b;border-radius:14px}.split{display:grid;grid-template-columns:2fr 1fr;gap:12px}.side{background:#0d1f2d;border:1px solid var(--line);border-radius:15px;padding:13px;height:max-content}.recent{padding:7px 0;border-bottom:1px solid #17374a;cursor:pointer}.recent:last-child{border-bottom:0}.count{font-weight:900;color:var(--c)}@media(max-width:840px){.split{grid-template-columns:1fr}.side{order:-1}}@media(max-width:560px){.w{padding:0 10px 40px}.head{margin:0 -10px 12px;padding:9px 10px}.q{min-width:100%}}</style><script src="data/core-a.js"></script><script src="data/p1.js"></script><script src="data/p2.js"></script><script src="data/p3.js"></script><script src="data/p4.js"></script><script src="data/p5.js"></script><script src="data/p6.js"></script><script src="data/p7.js"></script><script src="data/faults.js"></script><script src="data/tasks.js"></script><script src="data/sources.js"></script><script src="data/rules.js"></script></head><body><div class="w"><header class="head"><div class="brand"><div class="logo">CP</div><div><div class="k">Consulta técnica transversal · V1.2</div><h1>Hyundai Coupé RD 2.0 · Consulta CP</h1><div class="m">Pesquisa apenas a informação existente na base CP; não inventa compatibilidades.</div></div></div><div class="nav"><a class="btn" href="start.html">Início</a><a class="btn" href="index.html">Base Técnica</a><a class="btn" href="oficina.html">Oficina</a></div></header><section class="searchbox"><div class="searchrow"><input id="q" class="q" placeholder="Ex.: cabos ignição, misfire, FM-004, 40275, ABS, termóstato…" autocomplete="off"><select id="type" class="sel"><option value="">Tudo</option><option value="Peça">Peças</option><option value="Avaria">Avarias</option><option value="Referência">Referências</option><option value="Manual">Manuais</option><option value="Validação">Validações</option><option value="Fonte">Fontes</option><option value="Veículo">Veículo</option></select><select id="system" class="sel"><option value="">Todos os sistemas</option></select></div><div class="chips"><button class="chip" data-q="engasgos perda potência">Engasgos / potência</button><button class="chip" data-q="não pega arranque CKP CMP">Não pega</button><button class="chip" data-q="sobreaquecimento temperatura líquido">Sobreaquecimento</button><button class="chip" data-q="ABS sensor anel">ABS</button><button class="chip" data-q="ruído roda rolamento">Ruído de roda</button><button class="chip" data-q="SRS clock spring">Luz SRS</button><button class="chip" data-q="infiltração humidade vedantes">Infiltração</button><button class="chip" data-q="ar condicionado pouco frio">A/C</button></div><div class="meta"><span><span class="count" id="count">0</span> resultados</span><span class="m">· pesquisa por relevância, ID, texto, sistema e estado</span></div></section><div class="split"><main><div id="results" class="section"></div></main><aside class="side"><b>Favoritos</b><div id="favs" class="small" style="margin:8px 0 14px"></div><b>Consultas recentes</b><div id="recents" class="small" style="margin-top:8px"></div></aside></div></div><script>const C=window.CP_CORE||{};const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const sysMap={ENG:'Motor — estrutura',TIM:'Distribuição',LUB:'Lubrificação',CLG:'Arrefecimento',FUE:'Combustível e admissão',IGN:'Ignição e gestão do motor',EXH:'Escape e emissões',TRN:'Transmissão e embraiagem',DRV:'Transmissão às rodas',SUS:'Suspensão',STR:'Direção',BRK:'Travagem',ELC:'Elétrica, carga e arranque',LGT:'Iluminação e sinalização',HVA:'Climatização e ventilação',BDY:'Carroçaria e exterior',GLS:'Vidros, limpeza e vedação',INT:'Interior e comandos',SRS:'Retenção e segurança passiva',SRV:'Manutenção, consumíveis e fixação'};let docs=[];function add(type,id,title,text,system,status,raw){docs.push({type,id:String(id||''),title:String(title||''),text:String(text||''),system:String(system||''),status:String(status||''),raw})}const PF=window.CP_PARTS_FIELDS||[];(window.CP_PARTS||[]).forEach(r=>{let o=Object.fromEntries(PF.map((f,i)=>[f,r[i]]));add('Peça',o.ID||r[0],o['Peça']||o['Designação']||r[2],r.join(' '),o.Sistema||r[1],o.Estado||r[4],o)});(window.CP_FAULTS||[]).forEach(r=>add('Avaria',r[0],r[2],r.slice(3).join(' '),r[1],r[5],r));(C.refs||[]).forEach(o=>add('Referência',o.ID,o.Marca+' '+o.PN,(o['Aplicação do catálogo']||'')+' '+(o.Nota||''),o['Part ID']||'',o.Estado,o));(C.manuals||[]).forEach(o=>add('Manual',o.Manual_ID,o.Título,(o['Pré-requisitos']||'')+' '+(o.Ferramentas||'')+' '+(o.Peças||''),o.Sistema,o.Estado,o));const TF=window.CP_TASKS_FIELDS||[];(window.CP_TASKS||[]).forEach(r=>{let o=Object.fromEntries(TF.map((f,i)=>[f,r[i]]));add('Validação',r[0],r[1]||'Tarefa de validação',r.join(' '),r[4]||'',r[3]||'',o)});const SF=window.CP_SOURCES_FIELDS||[];(window.CP_SOURCES||[]).forEach(r=>{let o=Object.fromEntries(SF.map((f,i)=>[f,r[i]]));add('Fonte',r[0],r[1]||r[2]||'Fonte técnica',r.join(' '),'',r[3]||'',o)});(C.vehicle||[]).forEach(o=>add('Veículo',o.Campo,o.Campo,String(o.Valor||'')+' '+String(o['Evidência / nota']||''),'',o.Estado,o));Object.entries(sysMap).forEach(([k,v])=>system.insertAdjacentHTML('beforeend',`<option value="${k}">${esc(k+' · '+v)}</option>`));const key=d=>d.type+'|'+d.id;let favorites=JSON.parse(localStorage.getItem('cp_favs')||'[]');let recent=JSON.parse(localStorage.getItem('cp_recent')||'[]');function save(){localStorage.setItem('cp_favs',JSON.stringify(favorites));localStorage.setItem('cp_recent',JSON.stringify(recent))}function score(d,toks,phrase){let hay=norm([d.id,d.title,d.text,d.system,d.status,sysMap[d.system]||''].join(' '));let s=0;if(phrase&&hay.includes(phrase))s+=25;if(norm(d.id)===phrase)s+=80;if(norm(d.title)===phrase)s+=60;toks.forEach(t=>{if(norm(d.id).includes(t))s+=18;if(norm(d.title).includes(t))s+=10;if(norm(d.system).includes(t)||norm(sysMap[d.system]||'').includes(t))s+=6;if(norm(d.status).includes(t))s+=3;if(hay.includes(t))s+=2});return s}function tagClass(t){return {Peça:'part',Avaria:'fault','Referência':'ref',Manual:'manual','Fonte':'source','Validação':'task','Veículo':'vehicle'}[t]||'part'}function renderCard(d){let fav=favorites.includes(key(d));let detail='';if(d.type==='Avaria'&&Array.isArray(d.raw))detail=`<p><b>Sintomas:</b> ${esc(d.raw[3])}</p><p><b>Diagnóstico:</b> ${esc(d.raw[6])}</p>`;else if(d.type==='Referência')detail=`<p>${esc(d.raw['Aplicação do catálogo']||'')}</p><p class="small">${esc(d.raw.Nota||'')}</p>`;else if(d.type==='Peça')detail=`<p class="small">${esc(d.text.slice(0,320))}</p>`;else detail=`<p class="small">${esc(d.text.slice(0,360))}</p>`;return `<article class="result"><span class="tag ${tagClass(d.type)}">${esc(d.type)}</span> ${d.status?`<span class="tag part">${esc(d.status)}</span>`:''}<h3>${esc(d.id)} · ${esc(d.title)}</h3>${d.system?`<p class="small"><b>Sistema:</b> ${esc(d.system)} ${sysMap[d.system]?`· ${esc(sysMap[d.system])}`:''}</p>`:''}${detail}<div class="actions"><button class="mini ${fav?'fav':''}" onclick="toggleFav('${esc(key(d))}')">${fav?'★ Favorito':'☆ Guardar'}</button>${d.type==='Avaria'?`<a class="mini" href="oficina.html">Abrir Oficina</a>`:''}${d.type==='Peça'||d.type==='Referência'?`<a class="mini" href="index.html">Abrir Base Técnica</a>`:''}</div></article>`}function doSearch(push=true){let phrase=norm(q.value.trim()),toks=phrase.split(/\s+/).filter(Boolean),ty=type.value,sy=system.value;let r=docs.filter(d=>(!ty||d.type===ty)&&(!sy||d.system===sy));if(phrase)r=r.map(d=>[d,score(d,toks,phrase)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);else r=r.slice(0,80);count.textContent=r.length;results.innerHTML=r.length?r.slice(0,120).map(renderCard).join(''):`<div class="empty">Sem resultados na base CP para esta consulta. Isto significa apenas que a informação ainda não está registada; não é uma conclusão técnica.</div>`;if(push&&phrase){recent=[q.value.trim(),...recent.filter(x=>x!==q.value.trim())].slice(0,8);save();renderSide()}}function toggleFav(k){favorites=favorites.includes(k)?favorites.filter(x=>x!==k):[...favorites,k];save();doSearch(false);renderSide()}window.toggleFav=toggleFav;function renderSide(){favs.innerHTML=favorites.length?favorites.map(k=>{let d=docs.find(x=>key(x)===k);return d?`<div class="recent" onclick="q.value='${esc(d.id)}';doSearch(false)">★ ${esc(d.id)} · ${esc(d.title)}</div>`:''}).join(''):'Ainda sem favoritos.';recents.innerHTML=recent.length?recent.map(x=>`<div class="recent" onclick="q.value='${esc(x)}';doSearch(false)">${esc(x)}</div>`).join(''):'Ainda sem consultas.'}q.addEventListener('input',()=>doSearch(false));q.addEventListener('change',()=>doSearch(true));type.onchange=()=>doSearch(false);system.onchange=()=>doSearch(false);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;doSearch(true)});renderSide();doSearch(false);</script></body></html>
